# Statuses are informational until a baseline exists. A follow-up card sets
# targets.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# CI skips the Go or web jobs when a change does not touch them, so a flag
# keeps its last upload until its job runs again.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: go-unit
    - name: go-integration
    - name: web
