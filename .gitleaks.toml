title = "upmo"

[extend]
useDefault = true

[[rules]]
id = "upmo-personal-token"
description = "Upmo personal API token"
regex = '''upmo_pat_[A-Za-z0-9_-]{43}'''

[[rules]]
id = "upmo-service-key"
description = "Upmo process-to-process master key"
regex = '''upmo_svc_[A-Za-z0-9+/=_-]{43,}'''

[[allowlists]]
description = "published examples, not credentials"
regexes = [
  '''upmo_pat_\.\.\.''',
  '''upmo_svc_\.\.\.''',
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
]

[[allowlists]]
description = "dev-only service key shared by the local compose stack, never used outside it"
targetRules = ["upmo-service-key"]
condition = "AND"
paths = ['''^compose\.yml$''']
regexes = ['''^upmo_svc_Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2c$''']

[[allowlists]]
description = "editor token test fixtures are user, task and session UUIDs, not secrets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/runtime/domain/token_test\.go$''']
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

[[allowlists]]
description = "fake bearer value the extract test feeds to the redactor"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/memory/app/extract_test\.go$''']
regexes = ['''^abcDEF123456$''']

[[allowlists]]
description = "fake API key the providers test types into the form to prove it is never stored or echoed"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/features/providers/live-providers\.test\.tsx$''']
regexes = ['''^sk-live-secret-9d41f7$''']

[[allowlists]]
description = "placeholder marketplace public key in pack.go, not a secret; UPM-373 replaces it"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/agents/domain/pack\.go$''']
regexes = ['''^M8f2p4x7N5qR8vT1wZ3yB6dF9hJ2kL5mP8sV1xY4zA0=$''']
