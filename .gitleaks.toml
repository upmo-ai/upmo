title = "upmo"

[extend]
useDefault = true

[[rules]]
id = "upmo-personal-token"
description = "Upmo personal API token"
regex = '''upmo_pat_[A-Za-z0-9_-]{43}'''

[[rules]]
id = "upmo-service-key"
description = "Upmo process-to-process audience key"
regex = '''upmo_svc_[A-Za-z0-9+/=_-]{43,}'''

[[rules]]
id = "upmo-signing-key"
description = "Upmo editor JWT key, run JWT key or metrics scrape token"
regex = '''upmo_(?:edk|rnk|mtr)_[A-Za-z0-9+/=_-]{43,}'''

[[allowlists]]
description = "published examples, not credentials"
regexes = [
  '''upmo_pat_\.\.\.''',
  '''upmo_svc_\.\.\.''',
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
]

[[allowlists]]
description = "dev-only keys shared by the local compose stack, never used outside it (the first is the retired master, still in history)"
targetRules = ["upmo-service-key", "upmo-signing-key"]
condition = "AND"
paths = ['''^compose\.yml$''']
regexes = [
  '''^upmo_svc_Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2c$''',
  '''^upmo_svc_gateway_Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2c$''',
  '''^upmo_svc_sandboxd_c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M$''',
  '''^upmo_svc_markitdown_ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ$''',
  '''^upmo_svc_worker-brain_QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI$''',
  '''^upmo_svc_worker-gateway_R0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0c$''',
  '''^upmo_svc_worker-sandboxd_U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1M$''',
  '''^upmo_edk_ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU$''',
  '''^upmo_rnk_cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI$''',
  '''^upmo_mtr_dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ$''',
]

[[allowlists]]
description = "editor token test fixtures are user, task and session UUIDs, not secrets"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/runtime/domain/token_test\.go$''']
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

[[allowlists]]
description = "fake bearer value the extract test feeds to the redactor"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/memory/app/extract_test\.go$''']
regexes = ['''^abcDEF123456$''']

[[allowlists]]
description = "fake API key the providers test types into the form to prove it is never stored or echoed"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/features/providers/live-providers\.test\.tsx$''']
regexes = ['''^sk-live-secret-9d41f7$''']

[[allowlists]]
description = "placeholder marketplace public key in pack.go, not a secret; UPM-373 replaces it"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/agents/domain/pack\.go$''']
regexes = ['''^M8f2p4x7N5qR8vT1wZ3yB6dF9hJ2kL5mP8sV1xY4zA0=$''']

[[allowlists]]
description = "run token fuzz finding: the test claims (sub u, run r) signed with the fixed test key, not a secret"
targetRules = ["jwt"]
condition = "AND"
paths = ['''^internal/platform/runjwt/testdata/fuzz/FuzzVerify/43ea63883b9c6ba2$''']
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJhdWQiOiJjb25uZWN0b3JzIiwiZXhwIjoxNzAwMDAwOTAwLCJpYXQiOjE3MDAwMDAwMDAsImlzcyI6InVwbW8iLCJuYmYiOjE3MDAwMDAwMDAsInJ1biI6InIiLCJzdWIiOiJ1In0\.''']

[[allowlists]]
description = "fake plain API key the Vertex key test feeds in to prove it is refused"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/gateway/domain/provider_test\.go$''']
regexes = ['''^sk-123456789012$''']

[[allowlists]]
description = "fixed v2 bearer vector key shared by the Go and Python markitdown tests"
targetRules = ["upmo-service-key", "upmo-signing-key", "generic-api-key"]
condition = "AND"
paths = ['''^(deploy/markitdown/test_main\.py|internal/platform/svcsig/svcsig_test\.go)$''']
regexes = [
  '''^upmo_svc_markitdown_AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA$''',
]

[[allowlists]]
description = "metrics token test fixtures"
targetRules = ["upmo-service-key", "upmo-signing-key", "generic-api-key"]
condition = "AND"
paths = ['''^internal/platform/metrics/metrics_test\.go$''']
regexes = [
  '''^upmo_svc_gateway_bWV0cmljcy10b2tlbi1mb3ItdGVzdHMtb25seS0zMmJ5dGVz$''',
  '''^upmo_mtr_bWV0cmljcy10b2tlbi1mb3ItdGVzdHMtb25seS0zMmJ5dGVz$''',
]

[[allowlists]]
description = "config loader test fixtures, base64 of readable test phrases"
targetRules = ["upmo-service-key", "upmo-signing-key", "generic-api-key"]
condition = "AND"
paths = ['''^internal/platform/config/config_test\.go$''']
regexes = [
  '''^upmo_svc_gateway_Z2F0ZXdheS1rZXktZm9yLXRoZS1jb25maWctdGVzdCE$''',
  '''^upmo_svc_gateway_cHJldmlvdXMtZ2F0ZXdheS1rZXktY29uZmlnLXRlc3Q$''',
  '''^upmo_svc_sandboxd_c2FuZGJveGQta2V5LWZvci10aGUtY29uZmlnLXRlc3Q$''',
  '''^upmo_svc_sandboxd_cHJldmlvdXMtc2FuZGJveGQta2V5LWNvbmZpZy10c3Q$''',
  '''^upmo_svc_markitdown_bWFya2l0ZG93bi1rZXktZm9yLWNvbmZpZy10ZXN0cyE$''',
  '''^upmo_edk_ZWRpdG9yLWtleS1mb3ItdGhlLWNvbmZpZy10ZXN0ISE$''',
  '''^upmo_edk_cHJldmlvdXMtZWRpdG9yLWtleS1jb25maWctdGVzdCE$''',
  '''^upmo_rnk_cnVuLWtleS1mb3ItdGhlLWNvbmZpZy10ZXN0ISEhISE$''',
  '''^upmo_mtr_bWV0cmljcy10b2tlbi1mb3ItdGhlLWNvbmZpZy10c3Q$''',
]

[[allowlists]]
description = "metrics scrape token fixtures in the process listener tests"
targetRules = ["upmo-service-key", "upmo-signing-key", "generic-api-key"]
condition = "AND"
paths = ['''^(cmd/gateway/main_integration_test\.go|internal/sandboxd/sandboxd_test\.go|pkg/brain/main_integration_test\.go)$''']
regexes = [
  '''^upmo_mtr_Z2F0ZXdheS1tZXRyaWNzLXNjcmFwZS10b2tlbi10ZXN0$''',
  '''^upmo_mtr_c2FuZGJveGQtbWV0cmljcy1zY3JhcGUtdG9rZW4tdGVzdA$''',
  '''^upmo_mtr_YnJhaW4tbWV0cmljcy1zY3JhcGUtdG9rZW4tZm9yLXRlc3Q$''',
]
