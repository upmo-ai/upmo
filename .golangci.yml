version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # Domain packages hold no I/O.
        domain:
          files:
            - "**/internal/*/domain/**/*.go"
            - "**/internal/*/domain/*.go"
          deny:
            - pkg: database/sql
              desc: domain packages hold no I/O
            - pkg: net/http
              desc: domain packages hold no I/O
            - pkg: os/exec
              desc: domain packages hold no I/O
            - pkg: github.com/jackc/pgx
              desc: domain packages hold no I/O
            - pkg: connectrpc.com/connect
              desc: domain packages hold no I/O
            - pkg: github.com/riverqueue/river
              desc: domain packages hold no I/O
        # Container engine clients and sandboxd internals stay in
        # the sandboxd tree, so brain never holds container privileges.
        sandboxd:
          files:
            - "$all"
            - "!**/internal/sandboxd/*.go"
            - "!**/internal/sandboxd/**/*.go"
            - "!**/cmd/sandboxd/*.go"
            - "!**/cmd/sandboxd/**/*.go"
          deny:
            - pkg: github.com/docker
              desc: container engine clients run only in sandboxd
            - pkg: github.com/moby
              desc: container engine clients run only in sandboxd
            - pkg: github.com/containerd
              desc: container engine clients run only in sandboxd
            - pkg: k8s.io/client-go
              desc: container engine clients run only in sandboxd
            - pkg: github.com/upmo-ai/upmo/internal/sandboxd
              desc: only cmd/sandboxd imports sandboxd; brain uses the runtime SandboxProvider port
        # Admission rule: the kernel depends on the standard library
        # and the UUID package only.
        kernel:
          list-mode: strict
          files:
            - "**/internal/kernel/**/*.go"
            - "**/internal/kernel/*.go"
          allow:
            - $gostd
            - github.com/google/uuid

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/upmo-ai/upmo
