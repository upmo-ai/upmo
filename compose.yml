name: upmo

# Shared by every Go service. A service with its own environment merges this
# in, because a YAML merge key replaces nested maps instead of merging them.
x-go-env: &go-env
  GOMODCACHE: /go/pkg/mod
  GOCACHE: /root/.cache/go-build
  GOTOOLCHAIN: local
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

x-go: &go
  image: golang:1.26.11-bookworm@sha256:ea47ee45f1284d60f9cc09cb2c3bb4f508c256b640bd8bb30342ff13d1adcb52
  working_dir: /src
  volumes:
    - .:/src
    - upmo-gomodcache:/go/pkg/mod
    - upmo-gocache:/root/.cache/go-build
    # Git history for repolint and go build. The Makefile points this at the
    # common git directory when the checkout is a worktree; otherwise it is
    # the checkout's own .git.
    - ${UPMO_GIT_DIR:-./.git}:${UPMO_GIT_DIR:-/src/.git}:ro
  environment: *go-env
  networks:
    - dev

services:
  go:
    <<: *go

  brain:
    <<: *go
    volumes:
      - .:/src
      - upmo-gomodcache:/go/pkg/mod
      - upmo-gocache:/root/.cache/go-build
      - ${UPMO_GIT_DIR:-./.git}:${UPMO_GIT_DIR:-/src/.git}:ro
      - artifacts-data:/var/upmo/artifacts
      - knowledge-data:/var/upmo/knowledge
      - avatars-data:/var/upmo/avatars
    # Built then exec'd rather than go run, so SIGTERM reaches brain and it shuts
    # down gracefully; go run exits on SIGTERM without passing it on.
    command:
      - sh
      - -c
      - >-
        go build -ldflags "-X github.com/upmo-ai/upmo/internal/platform/buildinfo.Version=$${UPMO_VERSION:-dev} -X github.com/upmo-ai/upmo/internal/platform/buildinfo.Commit=$$(git rev-parse HEAD 2>/dev/null || echo unknown) -X github.com/upmo-ai/upmo/internal/platform/buildinfo.BuildTime=$$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/upmo ./cmd/upmo && exec /tmp/upmo
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *go-env
      # The local stack runs with the development-only keys and passwords
      # embedded below, so it says so.
      UPMO_ENV: development
      UPMO_DATABASE_URL: postgres://upmo:upmo@postgres:5432/upmo?sslmode=disable
      # Dev only. Never reuse outside the local compose stack. The request
      # pool logs in as the app role, which owns nothing.
      UPMO_DATABASE_APP_URL: postgres://upmo_app:upmo_app@postgres:5432/upmo?sslmode=disable
      UPMO_PUBLIC_URL: http://localhost:5173
      # brain reaches sandboxd only over HTTP, signed with the sandboxd key; it
      # never gets the engine socket. A task that needs a sandbox
      # fails with 503 while sandboxd is not running.
      UPMO_SANDBOXD_URL: http://sandboxd:8083
      # Optional conversion sidecar (profile docs). Empty skips PDF/HTML convert.
      UPMO_MARKITDOWN_URL: ${UPMO_MARKITDOWN_URL:-http://markitdown:8000}
      # Empty uses upmo/sandbox:base (build sandbox-image first). Override with
      # UPMO_SANDBOX_IMAGE when the install tags the sandbox image differently.
      UPMO_SANDBOX_IMAGE: ${UPMO_SANDBOX_IMAGE:-}
      UPMO_ARTIFACTS_DIR: /var/upmo/artifacts
      UPMO_KNOWLEDGE_DIR: /var/upmo/knowledge
      UPMO_AVATARS_DIR: /var/upmo/avatars
      # Optional dense retrieval. Empty EmbedRoute keeps FTS-only knowledge search.
      UPMO_GATEWAY_URL: http://gateway:8082
      UPMO_EMBED_ROUTE: ${UPMO_EMBED_ROUTE:-}
      # Dev only. Never reuse outside the local compose stack. Brain signs
      # calls with one key per audience and never holds a service master.
      UPMO_GATEWAY_KEY: upmo_svc_gateway_Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2c
      UPMO_SANDBOXD_KEY: upmo_svc_sandboxd_c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
      UPMO_MARKITDOWN_KEY: upmo_svc_markitdown_ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ
      UPMO_EDITOR_KEY: upmo_edk_ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU
      UPMO_RUN_KEY: upmo_rnk_cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI
      # Optional Prometheus listener serving GET /metrics to scrapers that send
      # UPMO_METRICS_TOKEN as a bearer. Unset disables it; it must differ from
      # UPMO_LISTEN_ADDR. Keep it internal.
      # UPMO_METRICS_ADDR: ":9090"
      # UPMO_METRICS_TOKEN: upmo_mtr_dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ
      # Optional comma-separated upmo_svc_* keys for /api/v1/provision/* control-plane
      # routes (supports key rotation). Leave empty/unset to disable provisioning (404).
      # UPMO_PROVISION_KEYS: ""
      # Dev only. Never reuse outside the local compose stack. Seals the provider
      # keys people add (base64 of 32 bytes). brain and gateway need the same value.
      # Default `upmo backup` archives are sealed with this key; restore needs
      # it (or UPMO_MASTER_KEY_PREVIOUS_<id> for the same id). Sealed values in
      # any archive still need their key id here, even with --passphrase-env.
      UPMO_MASTER_KEY: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      UPMO_MASTER_KEY_ID: k1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s

  gateway:
    <<: *go
    command:
      - sh
      - -c
      - >-
        go build -ldflags "-X github.com/upmo-ai/upmo/internal/platform/buildinfo.Version=$${UPMO_VERSION:-dev} -X github.com/upmo-ai/upmo/internal/platform/buildinfo.Commit=$$(git rev-parse HEAD 2>/dev/null || echo unknown) -X github.com/upmo-ai/upmo/internal/platform/buildinfo.BuildTime=$$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/gateway ./cmd/gateway && exec /tmp/gateway
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *go-env
      # The local stack runs with the development-only keys and passwords
      # embedded below, so it says so.
      UPMO_ENV: development
      UPMO_DATABASE_URL: postgres://upmo:upmo@postgres:5432/upmo?sslmode=disable
      UPMO_PUBLIC_URL: http://127.0.0.1:8082
      UPMO_LISTEN_ADDR: ":8082"
      # Dev only. Never reuse outside the local compose stack.
      UPMO_GATEWAY_KEY: upmo_svc_gateway_Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2c
      UPMO_CREDENTIAL_house: local-dev-not-a-provider-key
      # Dev only. Never reuse outside the local compose stack. Seals the provider
      # keys people add (base64 of 32 bytes). brain and gateway need the same value.
      UPMO_MASTER_KEY: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      UPMO_MASTER_KEY_ID: k1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  sandboxd:
    <<: *go
    command: ["sh", "-c", "go build -o /tmp/sandboxd ./cmd/sandboxd && exec /tmp/sandboxd"]
    env_file:
      - path: .env
        required: false
    # The API port only. The egress proxy on 3128 is not published: sandboxes
    # reach it as sandboxd:3128 on the internal sandbox-egress network.
    ports:
      - "127.0.0.1:8083:8083"
    # dev reaches the internet, so the proxy can dial allowed hosts.
    # sandbox-egress is internal: no route off the bridge and no outside DNS,
    # so the proxy is the only thing a sandbox can reach.
    networks:
      - dev
      - sandbox-egress
    # The go volumes, plus the engine socket for the Docker driver. Only the
    # sandboxd process gets the socket; the driver never mounts it into a
    # sandbox, and brain never gets it. :ro stops the path being
    # replaced, not API calls, so the socket still grants full engine access.
    volumes:
      - .:/src
      - upmo-gomodcache:/go/pkg/mod
      - upmo-gocache:/root/.cache/go-build
      - ${UPMO_GIT_DIR:-./.git}:${UPMO_GIT_DIR:-/src/.git}:ro
      - ${UPMO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      <<: *go-env
      # The local stack runs with the development-only keys embedded below,
      # so it says so.
      UPMO_ENV: development
      UPMO_LISTEN_ADDR: ":8083"
      UPMO_PROXY_ADDR: ":3128"
      # auto uses Docker when the socket answers and the stub otherwise.
      UPMO_SANDBOX_DRIVER: ${UPMO_SANDBOX_DRIVER:-auto}
      # Docker sandboxes join the network below and find the proxy by the
      # service name. The driver refuses a sandbox network that is not internal.
      UPMO_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME}_sandbox-egress
      UPMO_EGRESS_PROXY_URL: http://sandboxd:3128
      DOCKER_HOST: unix:///var/run/docker.sock
      # Empty uses the Docker driver's published OpenVSCode default.
      UPMO_EDITOR_IMAGE: ${UPMO_EDITOR_IMAGE:-}
      # Dev only. Never reuse outside the local compose stack.
      UPMO_SANDBOXD_KEY: upmo_svc_sandboxd_c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
      UPMO_EDITOR_KEY: upmo_edk_ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  # The sandbox image with git, from the base target of deploy/sandbox/Dockerfile.
  # It is built on the engine sandboxd drives, so the Docker driver finds it
  # without a pull: `docker compose build sandbox-image`. Never started.
  sandbox-image:
    image: upmo/sandbox:base
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: deploy/sandbox/Dockerfile
      target: base

  # markitdown-compatible conversion for knowledge file and URL bodies.
  # Internal only: no published ports. Start with `--profile docs`.
  markitdown:
    image: upmo/markitdown:dev
    profiles: ["docs"]
    build:
      context: ./deploy/markitdown
    networks:
      - dev
    environment:
      # Dev only. Never reuse outside the local compose stack. The sidecar
      # refuses to start without it and refuses /convert without brain's bearer.
      UPMO_MARKITDOWN_KEY: upmo_svc_markitdown_ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  golangci-lint:
    # v2.13.2 is the oldest v2 image whose Go (1.27) can load a go 1.26.5 module.
    # v2.12.2 ships Go 1.26.2, which refuses this module under GOTOOLCHAIN=local.
    image: golangci/golangci-lint:v2.13.2-alpine@sha256:da1f79b184ff1d98781648407d05a99b9cba7b282aa3416b0a0eac102a3b0557
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
      - upmo-gomodcache:/go/pkg/mod
      - upmo-gocache:/root/.cache/go-build
      - upmo-golangci-cache:/root/.cache/golangci-lint
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
      GOLANGCI_LINT_CACHE: /root/.cache/golangci-lint
      GOTOOLCHAIN: local

  web:
    image: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    working_dir: /src/web
    volumes:
      - .:/src
      - ${UPMO_GIT_DIR:-./.git}:${UPMO_GIT_DIR:-/src/.git}:ro
      # node_modules lives in a volume, off the slower bind mount.
      - upmo-web-node-modules:/src/web/node_modules
      - upmo-pnpm-store:/root/.local/share/pnpm/store
      - upmo-pnpm-cache:/root/.cache/pnpm
      - upmo-corepack:/root/.cache/node/corepack
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Absolute site origin for the og:image tags; empty leaves them out.
      VITE_SITE_ORIGIN: ${VITE_SITE_ORIGIN:-}
      pnpm_config_store_dir: /root/.local/share/pnpm/store
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - dev
    entrypoint: ["sh", "-c", "corepack enable && (command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)) && exec \"$$@\"", "--"]
    command: ["pnpm", "dev"]

  # Official Playwright image: browsers and system libraries only. The npm
  # package is installed into a volume by e2e/run.sh so the web app does not
  # gain a dependency. Kept off the default `up` and off `make ci`.
  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    profiles: ["e2e"]
    user: root
    working_dir: /src
    # Share the dev server's network so the browser's Host is 127.0.0.1.
    # Vite rejects any other host, including the compose service name.
    network_mode: "service:web"
    ipc: host
    init: true
    volumes:
      - .:/src
      - upmo-playwright:/opt/playwright
    environment:
      WEB_URL: http://localhost:5173
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command: ["sh", "/src/e2e/run.sh"]

  osv-scanner:
    image: ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["scan", "source", "--no-call-analysis=go", "-L", "go.mod", "-L", "web/pnpm-lock.yaml", "-L", "e2e/package-lock.json", "-L", "deploy/markitdown/requirements.txt"]

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
      - ${UPMO_GIT_DIR:-./.git}:${UPMO_GIT_DIR:-/src/.git}:ro
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    command: ["git", "--no-banner", "--redact", "--verbose", "--config", "/src/.gitleaks.toml", "/src"]

  markdownlint:
    image: davidanson/markdownlint-cli2:v0.23.1@sha256:f382ea4fdc949883e79de678009437fb40c339323654c7b0dd4d5221cda8ed20
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["**/*.md"]

  lychee:
    image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["--config", "lychee.toml", "--no-progress", "."]

  shellcheck:
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    command: ["canary/lib.sh", "canary/selftest.sh"]

  # Workflow files: actionlint checks syntax and shell steps, zizmor checks
  # for security mistakes (unpinned actions, token scope, injection).
  actionlint:
    image: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["-color"]

  zizmor:
    image: ghcr.io/zizmorcore/zizmor:1.5.2@sha256:2eec97e326025cebb147a380011ff40402866275cbb9e85968a471ca592c00a3
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["--no-progress", "--persona", "auditor", ".github"]

  # Dockerfiles: hadolint lints the files, trivy scans the images built by
  # `make images`. trivy reads them through the engine socket.
  hadolint:
    image: hadolint/hadolint:v2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src:ro
    command: ["hadolint", "deploy/markitdown/Dockerfile", "deploy/sandbox/Dockerfile"]

  trivy:
    image: aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
    profiles: ["tools"]
    volumes:
      - ${UPMO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - upmo-trivy-cache:/root/.cache/trivy
    # The image name is the run argument: `docker compose run --rm trivy <image>`.
    entrypoint: ["trivy", "image", "--no-progress", "--exit-code", "1", "--severity", "HIGH,CRITICAL", "--ignore-unfixed"]

  bash:
    image: bash:5.3.15-alpine3.24@sha256:a19c811ee9e97fa8a080001d82b8e0ded303f0795cffdb1cbd162731bc8ce208
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./scripts/canary:/scripts:ro
    command: ["bash", "/scripts/selftest.sh"]

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    # Dev only credentials. Never reuse them outside the local compose stack.
    environment:
      POSTGRES_USER: upmo
      POSTGRES_PASSWORD: upmo
      POSTGRES_DB: upmo
    volumes:
      - upmo-pgdata:/var/lib/postgresql
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upmo -d upmo"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  dev:
  # The sandbox network: sandboxd and Docker sandboxes only. Internal, so a
  # sandbox has no route out but the egress proxy.
  sandbox-egress:
    internal: true

volumes:
  artifacts-data:
  knowledge-data:
  avatars-data:
  upmo-gomodcache:
  upmo-gocache:
  upmo-golangci-cache:
  upmo-trivy-cache:
  upmo-pnpm-store:
  upmo-pnpm-cache:
  upmo-web-node-modules:
  upmo-corepack:
  upmo-playwright:
  upmo-pgdata:
