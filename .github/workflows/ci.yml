name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Go caches live in runner folders so the cache steps can restore and save
# them. -count=1 keeps a restored cache from replaying test results. Test
# databases need no durability.
env:
  UPMO_GOMODCACHE: /home/runner/upmo-cache/gomod
  UPMO_GOCACHE: /home/runner/upmo-cache/gobuild
  UPMO_GOLANGCI_CACHE: /home/runner/upmo-cache/golangci
  UPMO_GOFLAGS: -count=1
  UPMO_PG_DURABLE: "off"

# A newer push cancels a pull request run. Every push to main finishes, so
# each commit on main gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gotest: ${{ steps.pick.outputs.gotest }}
      gocode: ${{ steps.pick.outputs.gocode }}
      integration: ${{ steps.pick.outputs.integration }}
      golint: ${{ steps.pick.outputs.golint }}
      vuln: ${{ steps.pick.outputs.vuln }}
      web: ${{ steps.pick.outputs.web }}
      shell: ${{ steps.pick.outputs.shell }}
      e2e: ${{ steps.pick.outputs.e2e }}
      images: ${{ steps.pick.outputs.images }}
      docs: ${{ steps.pick.outputs.docs }}
      workflows: ${{ steps.pick.outputs.workflows }}
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Each group turns on the jobs that check it. The weekly run, a first
      # push, a failed diff, and any change to ci.yml, its actions or the
      # Makefile turn on every group. A compose.yml change turns on every
      # group too, unless it only changes image: lines; then each image turns
      # on the groups whose jobs run it, and an image not mapped below turns
      # on every group. Each root file maps to the jobs that read it; a root
      # file not in `known` turns on every group until it is mapped. Root
      # files no gated job reads: .gitleaks.toml (Secret Scan always runs),
      # codecov.yml, .editorconfig and .env.example.
      # `policy` is what repolint's TestRepoGoingPublic in Go Tests reads:
      # the root policy files, web/package.json and file names it forbids.
      - name: Pick Jobs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all=false
          files=""
          extra=""
          if [ "$EVENT" = schedule ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            all=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE...$HEAD"); then
            all=true
          fi
          has() { grep -Eq "$1" <<< "$files"; }
          known='^([^/]+\.md|LICENSE|Makefile|compose\.yml|go\.(mod|sum)|lychee\.toml|codecov\.yml|osv-scanner\.toml|\.editorconfig|\.env\.example|\.gitignore|\.gitleaks\.toml|\.golangci\.yml|\.hadolint\.yaml|\.markdownlint-cli2\.jsonc)$'
          if has '^(\.github/workflows/ci\.yml|Makefile)$|^\.github/actions/'; then all=true; fi
          if grep -E '^[^/]+$' <<< "$files" | grep -Evq "$known"; then all=true; fi
          if [ "$all" = false ] && has '^compose\.yml$'; then
            lines=$(git diff -U0 --no-color "$BASE...$HEAD" -- compose.yml | grep -E '^[-+]' | grep -Ev '^(--- a|\+\+\+ b)/compose\.yml$') || true
            if [ -z "$lines" ] || grep -Evq '^[-+][[:space:]]*image:[[:space:]]' <<< "$lines"; then
              all=true
            else
              while read -r image; do
                case "$image" in
                  golang) extra="$extra gotest gocode integration golint vuln e2e" ;;
                  golangci/golangci-lint) extra="$extra golint" ;;
                  node) extra="$extra web e2e" ;;
                  mcr.microsoft.com/playwright) extra="$extra e2e" ;;
                  pgvector/pgvector) extra="$extra integration e2e" ;;
                  ghcr.io/google/osv-scanner) extra="$extra vuln" ;;
                  ghcr.io/gitleaks/gitleaks) ;;
                  davidanson/markdownlint-cli2 | lycheeverse/lychee) extra="$extra docs" ;;
                  koalaman/shellcheck | bash) extra="$extra shell" ;;
                  rhysd/actionlint | ghcr.io/zizmorcore/zizmor) extra="$extra workflows" ;;
                  hadolint/hadolint | aquasec/trivy) extra="$extra images" ;;
                  upmo/sandbox | upmo/markitdown) extra="$extra images e2e" ;;
                  *) all=true ;;
                esac
              done < <(sed -E 's/^[-+][[:space:]]*image:[[:space:]]*//; s/[:@].*$//' <<< "$lines" | sort -u)
            fi
          fi
          gocode='^(cmd|internal|pkg|tools)/|^go\.(mod|sum)$'
          policy='^(README\.md|LICENSE|SECURITY\.md|CONTRIBUTING\.md|\.gitignore)$|^web/package\.json$|(^|/)(\.env(\.[^/]*)?|AGENTS\.md|CLAUDE\.md)$|(^|/)\.(claude|cursor|kiro|gemini)/'
          on() { if [ "$all" = true ] || has "$2" || [[ " $extra " == *" $1 "* ]]; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            on gotest "$gocode|$policy|^\.githooks/"
            on gocode "$gocode"
            on integration "$gocode"
            on golint "$gocode|^\.golangci\.yml$"
            on vuln "$gocode|^(web/pnpm-lock\.yaml|e2e/package-lock\.json|deploy/markitdown/requirements\.txt|osv-scanner\.toml)$"
            on web '^web/'
            on shell '^(scripts|\.githooks)/'
            on e2e '^(cmd|internal|pkg|web|e2e|deploy)/|^go\.(mod|sum)$'
            on images '^deploy/|(^|/)Dockerfile$|^\.hadolint\.yaml$'
            on docs '\.md$|\.html$|^docs/|^LICENSE$|^lychee\.toml$|^\.markdownlint-cli2\.jsonc$'
            on workflows '^\.github/'
          } | tee -a "$GITHUB_OUTPUT" > picked.txt
          {
            echo "## Changes"
            echo
            echo "| Group | Runs |"
            echo "| --- | --- |"
            sed 's/^\(.*\)=\(.*\)$/| \1 | \2 |/' picked.txt
          } >> "$GITHUB_STEP_SUMMARY"

  go:
    name: Go Tests
    needs: changes
    if: needs.changes.outputs.gotest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          build: go-tests
      - name: Run Go Tests
        run: |
          mkdir -p reports
          make test-go 2>&1 | tee reports/go.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build: go-tests
      - name: Upload Go Coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/go-unit.cover
          flags: go-unit
          disable_search: true
          fail_ci_if_error: false
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Go Tests
          status: ${{ job.status }}
          files: reports/go-unit.xml reports/go-unit.cover reports/go.log

  go-integration:
    name: Go Integration Tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          build: go-integration
      - name: Run Go Integration Tests
        run: |
          mkdir -p reports
          make test-integration 2>&1 | tee reports/go-integration.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build: go-integration
      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/go-integration.cover
          flags: go-integration
          disable_search: true
          fail_ci_if_error: false
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Go Integration Tests
          status: ${{ job.status }}
          files: reports/go-integration.xml reports/go-integration.cover reports/go-integration.log

  canary:
    name: Canary
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Canary
        run: |
          mkdir -p reports
          make canary 2>&1 | tee reports/canary.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Canary
          status: ${{ job.status }}
          files:  reports/canary.log

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          build: lint
          lint: "true"
      - name: Run Lint
        env:
          GO_CHANGED: ${{ needs.changes.outputs.golint }}
          SHELL_CHANGED: ${{ needs.changes.outputs.shell }}
        run: |
          mkdir -p reports
          set -- lint-terms
          if [ "$GO_CHANGED" = true ]; then set -- lint-go "$@"; fi
          if [ "$SHELL_CHANGED" = true ]; then set -- lint-shell "$@"; fi
          echo "make $*" | tee reports/lint.log
          make "$@" 2>&1 | tee -a reports/lint.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build: lint
          lint: "true"
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Lint
          status: ${{ job.status }}
          files:  reports/lint.log

  arch:
    name: Architecture Check
    needs: changes
    if: needs.changes.outputs.gocode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
      - name: Run Architecture Check
        run: |
          mkdir -p reports
          make arch 2>&1 | tee reports/arch.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Architecture Check
          status: ${{ job.status }}
          files:  reports/arch.log

  web:
    name: Web Checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Web Checks
        run: |
          mkdir -p reports
          make web 2>&1 | tee reports/web.log
      - name: Upload Web Coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: false
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Web Checks
          status: ${{ job.status }}
          files: reports/web.xml web/coverage/lcov.info reports/web.log

  e2e:
    name: End-to-End Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          build: e2e
      - name: Run End-to-End Tests
        run: |
          mkdir -p reports
          make e2e 2>&1 | tee reports/e2e.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build: e2e
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: End-to-End Tests
          status: ${{ job.status }}
          files:  reports/e2e.log

  vuln:
    name: Vulnerability Scan
    needs: changes
    if: needs.changes.outputs.vuln == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
      - name: Run Vulnerability Scan
        run: |
          mkdir -p reports
          make vuln 2>&1 | tee reports/vuln.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Vulnerability Scan
          status: ${{ job.status }}
          files:  reports/vuln.log

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Secret Scan
        run: |
          mkdir -p reports
          make secrets 2>&1 | tee reports/secrets.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Secret Scan
          status: ${{ job.status }}
          files:  reports/secrets.log

  commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request checkout is a synthetic merge commit; check the head
      # commits against the base branch instead. A push to main has nothing
      # newer than main to check.
      - name: Run Commit Messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || 'origin/main..HEAD' }}
        run: |
          mkdir -p reports
          make commits COMMITS_RANGE="$RANGE" 2>&1 | tee reports/commits.log
      - name: Run Migration Check
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.event.pull_request.head.sha) || 'origin/main...HEAD' }}
        run: |
          mkdir -p reports
          make migrations MIGRATIONS_RANGE="$RANGE" 2>&1 | tee reports/migrations.log
      # The squash merge uses the title as the subject on main. The title
      # reaches the check only through env, never inside the run line.
      - name: Run Title Check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          mkdir -p reports
          make title 2>&1 | tee reports/title.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Commit Messages
          status: ${{ job.status }}
          files:  reports/commits.log reports/migrations.log reports/title.log

  docs:
    name: Docs Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Docs Check
        run: |
          mkdir -p reports
          make docs 2>&1 | tee reports/docs.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Docs Check
          status: ${{ job.status }}
          files:  reports/docs.log

  fuzz:
    name: Fuzz Tests
    needs: changes
    if: needs.changes.outputs.gocode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go Cache
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          build: fuzz
      - name: Run Fuzz Tests
        run: |
          mkdir -p reports
          make -j4 --output-sync=target fuzz 2>&1 | tee reports/fuzz.log
      - name: Save Go Cache
        if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          save: "true"
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build: fuzz
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Fuzz Tests
          status: ${{ job.status }}
          files:  reports/fuzz.log

  workflows:
    name: Workflow Security
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Workflow Security
        run: |
          mkdir -p reports
          make workflows 2>&1 | tee reports/workflows.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Workflow Security
          status: ${{ job.status }}
          files:  reports/workflows.log

  images:
    name: Container Images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Container Images
        run: |
          mkdir -p reports
          make images 2>&1 | tee reports/images.log
      - name: Write Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: Container Images
          status: ${{ job.status }}
          files:  reports/images.log

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review Dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          # Licenses that cannot ship inside an AGPL-3.0 program.
          deny-licenses: GPL-2.0-only, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: never
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  ci-ok:
    name: CI Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !cancelled() }}
    needs:
      - changes
      - go
      - go-integration
      - canary
      - lint
      - arch
      - web
      - e2e
      - vuln
      - secrets
      - commits
      - docs
      - fuzz
      - workflows
      - images
      - dependency-review
    steps:
      - name: Write Summary
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI Result"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
      # A skipped job passes: Changes found nothing for it to check.
      - name: Fail Unless Every Job Passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "A required job did not pass."; exit 1 ;;
          esac
