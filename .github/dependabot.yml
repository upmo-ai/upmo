version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /deploy/markitdown
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/markitdown
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/sandbox
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    # playwright moves with the mcr.microsoft.com/playwright image tag in
    # compose.yml and e2e/install.sh, by hand.
    ignore:
      - dependency-name: playwright
